name: Ecosystem Adoption

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem-adoption:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install LLVM 17
        run: |
          brew install llvm@17
          echo "LLVM_SYS_170_PREFIX=$(brew --prefix llvm@17)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@17)/bin" >> "$GITHUB_PATH"

      - name: Validate ecosystem adoption workflow
        run: |
          VERSION="$(python3 -c 'import re, pathlib; print(re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text(encoding="utf-8")).group(1))')"

          bash -n scripts/package_submission_check.sh scripts/external_install_check.sh scripts/package_publication_check.sh scripts/package_submission_packet.sh
          python3 -m py_compile scripts/package_submission_check.py scripts/external_install_check.py scripts/package_publication_check.py scripts/package_submission_packet.py
          find scripts -name __pycache__ -type d -prune -exec rm -rf {} +

          cargo build --bin cool
          ./target/debug/cool examples/first_30_minutes/src/main.cool
          ./target/debug/cool --vm examples/first_30_minutes/src/main.cool
          ./target/debug/cool check examples/first_30_minutes/src/main.cool
          (
            EXAMPLE_TMP="$(mktemp -d)"
            cp -R examples/first_30_minutes "$EXAMPLE_TMP/first_30_minutes"
            cd "$EXAMPLE_TMP/first_30_minutes"
            "$GITHUB_WORKSPACE/target/debug/cool" build
            ./first30
          )

          bash scripts/release_candidate.sh --skip-gate --platform macos-arm64
          bash scripts/promote_release.sh --version "$VERSION" --platform macos-arm64 --allow-skipped-gate
          bash scripts/package_channels.sh generate --version "$VERSION"
          bash scripts/package_submission_check.sh \
            --version "$VERSION" \
            --report "dist/validation/$VERSION/package-submission.json" \
            --write-checklist "dist/validation/$VERSION/PACKAGE_SUBMISSION_CHECKLIST.md"
          bash scripts/external_install_check.sh \
            --version "$VERSION" \
            --report "dist/validation/$VERSION/external-install.json" \
            --write-plan "dist/validation/$VERSION/EXTERNAL_INSTALL_PLAN.md"
          bash scripts/package_publication_check.sh \
            --version "$VERSION" \
            --report "dist/validation/$VERSION/package-publication.json" \
            --write-evidence "dist/validation/$VERSION/PACKAGE_PUBLICATION_EVIDENCE.md"
          bash scripts/package_submission_packet.sh \
            --version "$VERSION" \
            --report "dist/validation/$VERSION/package-submission-packet.json" \
            --write-checklist "dist/validation/$VERSION/PACKAGE_SUBMISSION_PACKET_CHECKLIST.md"

      - name: Upload ecosystem reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cool-ecosystem-adoption
          path: dist/validation/**
