name: Package Submission Review

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-submission-review:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate submission review ledger
        run: |
          VERSION="$(python3 -c 'import re, pathlib; print(re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text(encoding="utf-8")).group(1))')"

          bash -n scripts/package_submission_packet.sh
          python3 -m py_compile scripts/package_submission_packet.py
          find scripts -name __pycache__ -type d -prune -exec rm -rf {} +

          bash scripts/package_submission_packet.sh \
            --version "$VERSION" \
            --ledger-only \
            --report "dist/validation/$VERSION/package-submission-packet-ledger.json" \
            --write-checklist "dist/validation/$VERSION/PACKAGE_SUBMISSION_PACKET_LEDGER.md"

      - name: Upload submission review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cool-package-submission-review
          path: dist/validation/**
